apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-uwm-kafka-metrics
  namespace: edl-data
spec:
  podSelector:
    matchLabels: {strimzi.io/cluster: edl-kafka}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: openshift-user-workload-monitoring}
      ports:
        - {protocol: TCP, port: 9404}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-uwm-trino-metrics
  namespace: edl-data
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: trino}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: openshift-user-workload-monitoring}
      ports:
        - {protocol: TCP, port: 8080}
