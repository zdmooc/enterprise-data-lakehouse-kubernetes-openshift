apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: edl-kafka
  namespace: openshift-gitops
spec:
  project: enterprise-data-lakehouse
  source:
    repoURL: https://github.com/zdmooc/enterprise-data-lakehouse-kubernetes-openshift.git
    targetRevision: main
    path: data-platform/kafka/profiles/crc
  destination:
    server: https://kubernetes.default.svc
    namespace: edl-data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
