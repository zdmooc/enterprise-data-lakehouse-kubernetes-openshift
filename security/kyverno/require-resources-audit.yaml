apiVersion: policies.kyverno.io/v1
kind: NamespacedValidatingPolicy
metadata:
  name: require-cpu-memory-resources
  namespace: edl-data
spec:
  validationActions:
    - Audit
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        object.spec.containers.all(c,
          has(c.resources) &&
          has(c.resources.requests) &&
          has(c.resources.limits) &&
          "cpu" in c.resources.requests &&
          "memory" in c.resources.requests &&
          "cpu" in c.resources.limits &&
          "memory" in c.resources.limits)
      message: Every container should declare CPU/memory requests and limits.
