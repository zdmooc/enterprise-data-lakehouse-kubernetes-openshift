apiVersion: batch/v1
kind: Job
metadata:
  name: kind-spark-__MODE__-submit
  namespace: edl-data
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        edl.network/api-client: 'true'
        app.kubernetes.io/name: edl-lakehouse-submit
    spec:
      restartPolicy: Never
      serviceAccountName: spark-runner
      securityContext:
        runAsNonRoot: true
        runAsUser: 185
        runAsGroup: 0
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: spark-submit
          image: edl-spark-lakehouse:kind-4.1.3-iceberg1.11
          imagePullPolicy: IfNotPresent
          command: [bash, /opt/edl-templates/submit.sh]
          env:
            - {name: MODE, value: __MODE__}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 768Mi}
          volumeMounts:
            - {name: templates, mountPath: /opt/edl-templates, readOnly: true}
      volumes:
        - name: templates
          configMap: {name: kind-spark-templates}
