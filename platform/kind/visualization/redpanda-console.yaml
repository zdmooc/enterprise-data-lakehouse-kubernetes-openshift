apiVersion: apps/v1
kind: Deployment
metadata:
  name: edl-kafka-console
  labels:
    app.kubernetes.io/name: redpanda-console
    app.kubernetes.io/component: kafka-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edl-kafka-console
  template:
    metadata:
      labels:
        app: edl-kafka-console
        app.kubernetes.io/name: redpanda-console
        app.kubernetes.io/component: kafka-ui
        edl.network/kafka-client: "true"
    spec:
      serviceAccountName: data-workload
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: console
          image: docker.redpanda.com/redpandadata/console:v3.12.0
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BROKERS
              value: edl-kafka-kafka-bootstrap.edl-data.svc.cluster.local:9092
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 20
            periodSeconds: 15
          securityContext:
            # The upstream image declares USER redpandaconsole (a name, not a
            # numeric UID). kubelet cannot prove that a named USER is non-root
            # when runAsNonRoot=true, so pin a non-zero numeric UID explicitly
            # for the restricted Pod Security profile used by edl-data.
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 300m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: edl-kafka-console
spec:
  selector: {app: edl-kafka-console}
  ports:
    - {name: http, port: 8080, targetPort: http}
