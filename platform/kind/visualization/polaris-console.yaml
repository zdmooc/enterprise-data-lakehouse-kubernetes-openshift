apiVersion: apps/v1
kind: Deployment
metadata:
  name: edl-polaris-console
  labels:
    app.kubernetes.io/name: polaris-console
    app.kubernetes.io/component: catalog-ui
spec:
  replicas: 1
  selector:
    matchLabels: {app: edl-polaris-console}
  template:
    metadata:
      labels:
        app: edl-polaris-console
        app.kubernetes.io/name: polaris-console
        app.kubernetes.io/component: catalog-ui
    spec:
      serviceAccountName: data-workload
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: console
          image: apache/polaris-console:kind-9e68700
          imagePullPolicy: IfNotPresent
          env:
            # These are browser-visible URLs. The demo port-forward script
            # exposes Polaris API on 18181 and Console on 18182.
            - {name: VITE_POLARIS_API_URL, value: "http://127.0.0.1:18181"}
            - {name: VITE_POLARIS_REALM, value: "POLARIS"}
            - {name: VITE_POLARIS_PRINCIPAL_SCOPE, value: "PRINCIPAL_ROLE:ALL"}
            - {name: VITE_OAUTH_TOKEN_URL, value: "http://127.0.0.1:18181/api/catalog/v1/oauth/tokens"}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 15
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 300m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: edl-polaris-console
spec:
  selector: {app: edl-polaris-console}
  ports:
    - {name: http, port: 8080, targetPort: http}
