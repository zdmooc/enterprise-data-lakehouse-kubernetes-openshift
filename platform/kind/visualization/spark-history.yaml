apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spark-event-logs
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: edl-spark-history-config
data:
  spark-defaults.conf: |
    spark.history.fs.logDirectory file:/spark-events
    spark.history.ui.port 18080
    spark.history.fs.update.interval 5s
    spark.history.retainedApplications 20
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edl-spark-history
  labels:
    app.kubernetes.io/name: spark-history-server
    app.kubernetes.io/component: spark-ui
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: edl-spark-history}
  template:
    metadata:
      labels:
        app: edl-spark-history
        app.kubernetes.io/name: spark-history-server
        app.kubernetes.io/component: spark-ui
    spec:
      serviceAccountName: data-workload
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: edl-lab-worker2
      securityContext:
        runAsNonRoot: true
        runAsUser: 185
        runAsGroup: 0
        fsGroup: 0
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: history
          image: edl-spark-lakehouse:kind-4.1.3-iceberg1.11
          imagePullPolicy: IfNotPresent
          command:
            - /opt/spark/bin/spark-class
            - org.apache.spark.deploy.history.HistoryServer
          env:
            - {name: HOME, value: /tmp}
            - {name: SPARK_LOCAL_DIRS, value: /tmp/spark}
          ports:
            - {name: http, containerPort: 18080}
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {cpu: 500m, memory: 768Mi}
          volumeMounts:
            - {name: events, mountPath: /spark-events}
            - {name: history-config, mountPath: /opt/spark/conf/spark-defaults.conf, subPath: spark-defaults.conf}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: events
          persistentVolumeClaim: {claimName: spark-event-logs}
        - name: history-config
          configMap: {name: edl-spark-history-config}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: edl-spark-history
spec:
  selector: {app: edl-spark-history}
  ports:
    - {name: http, port: 18080, targetPort: http}
