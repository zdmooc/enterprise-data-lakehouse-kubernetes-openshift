apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kind-contract
  namespace: edl-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 256Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: kind-contract
  namespace: edl-data
  labels: {app: kind-contract}
spec:
  serviceAccountName: data-workload
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: probe
      image: busybox:1.36.1
      command: [sh, -c, 'sleep 86400']
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 64Mi}
      volumeMounts:
        - {name: data, mountPath: /data}
  volumes:
    - name: data
      persistentVolumeClaim: {claimName: kind-contract}
