apiVersion: v1
kind: Pod
metadata:
  labels:
    edl.s3-client: 'true'
spec:
  # Local demo only: pin Spark driver/executor to the same Kind node as the
  # ReadWriteOnce event-log PVC consumed by Spark History Server.
  nodeSelector:
    kubernetes.io/hostname: edl-lab-worker2
  securityContext:
    runAsNonRoot: true
    runAsUser: 185
    runAsGroup: 0
    fsGroup: 0
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: spark-kubernetes
      env:
        - {name: HOME, value: /tmp}
        - {name: SPARK_LOCAL_DIRS, value: /tmp/spark}
        - {name: PYTHONDONTWRITEBYTECODE, value: '1'}
      volumeMounts:
        - name: edl-templates
          mountPath: /opt/edl-templates
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: spark-events
          mountPath: /spark-events
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
  volumes:
    - name: edl-templates
      configMap:
        name: kind-spark-templates
    - name: tmp
      emptyDir: {}
    - name: spark-events
      persistentVolumeClaim:
        claimName: spark-event-logs
