replicaCount: 1

image:
  repository: apache/polaris
  tag: "1.7.0"
  pullPolicy: IfNotPresent

persistence:
  type: in-memory

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 0
  fsGroup: 0
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

extraServices: []

service:
  type: ClusterIP

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1536Mi

extraEnv:
  - name: POLARIS_BOOTSTRAP_CREDENTIALS
    valueFrom:
      secretKeyRef:
        name: polaris-bootstrap
        key: credentials
  - name: POLARIS_REALM_CONTEXT_REALMS
    value: POLARIS
  - name: AWS_REGION
    valueFrom:
      secretKeyRef:
        name: polaris-s3
        key: region
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: polaris-s3
        key: accessKeyId
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: polaris-s3
        key: secretAccessKey
  # Browser-based Polaris Console (local demo port-forward).
  - name: QUARKUS_HTTP_CORS_ENABLED
    value: "true"
  - name: QUARKUS_HTTP_CORS_ORIGINS
    value: "http://127.0.0.1:18182,http://localhost:18182"
  - name: QUARKUS_HTTP_CORS_METHODS
    value: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
  - name: QUARKUS_HTTP_CORS_HEADERS
    value: "Content-Type,Authorization,Polaris-Realm,X-Request-ID"
  - name: QUARKUS_HTTP_CORS_EXPOSED_HEADERS
    value: "*"
  - name: QUARKUS_HTTP_CORS_ACCESS_CONTROL_ALLOW_CREDENTIALS
    value: "true"
