apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: edl-spark
  namespace: edl-data
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: edl-spark
  namespace: edl-data
spec:
  source:
    type: Git
    git:
      uri: https://github.com/zdmooc/enterprise-data-lakehouse-kubernetes-openshift.git
      ref: main
    contextDir: data-platform/spark
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: image/Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: edl-spark:4.2.0
