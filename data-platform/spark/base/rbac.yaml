apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-runner
  namespace: edl-data
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-runner
  namespace: edl-data
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create","get","list","watch","delete","patch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services","configmaps"]
    verbs: ["create","get","list","watch","delete","patch","update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-runner
  namespace: edl-data
subjects:
  - kind: ServiceAccount
    name: spark-runner
    namespace: edl-data
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spark-runner
