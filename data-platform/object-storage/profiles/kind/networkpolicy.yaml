apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kind-s3-ingress
spec:
  podSelector:
    matchLabels: {app: edl-s3}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {edl.s3-client: 'true'}
        - podSelector:
            matchLabels: {app.kubernetes.io/name: polaris}
        - podSelector:
            matchLabels: {app.kubernetes.io/name: trino}
        - podSelector:
            matchExpressions:
              - {key: spark-role, operator: In, values: [driver, executor]}
      ports:
        - {protocol: TCP, port: 9000}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kind-s3-client-egress
spec:
  podSelector:
    matchLabels: {edl.s3-client: 'true'}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app: edl-s3}
      ports:
        - {protocol: TCP, port: 9000}
