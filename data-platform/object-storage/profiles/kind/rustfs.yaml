apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: edl-s3
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: edl-s3
spec:
  selector: {app: edl-s3}
  ports:
    - {name: s3, port: 9000, targetPort: s3}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edl-s3
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: edl-s3}
  template:
    metadata:
      labels: {app: edl-s3}
    spec:
      serviceAccountName: data-workload
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.0
          ports:
            - {name: s3, containerPort: 9000}
          env:
            - {name: RUSTFS_VOLUMES, value: /data}
            - {name: RUSTFS_ADDRESS, value: '0.0.0.0:9000'}
            - {name: RUSTFS_CONSOLE_ENABLE, value: 'false'}
            - {name: RUSTFS_OBS_LOG_DIRECTORY, value: /logs}
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: kind-s3, key: AWS_ACCESS_KEY_ID}
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: kind-s3, key: AWS_SECRET_ACCESS_KEY}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 1Gi}
          startupProbe:
            httpGet: {path: /health, port: s3}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: s3}
          livenessProbe:
            httpGet: {path: /health, port: s3}
            periodSeconds: 20
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: logs, mountPath: /logs}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: edl-s3}
        - name: logs
          emptyDir: {}
