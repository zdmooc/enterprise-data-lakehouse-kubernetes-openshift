apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: edl-spark-lakehouse
  namespace: edl-data
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: edl-spark-lakehouse
  namespace: edl-data
spec:
  source:
    type: Git
    git:
      uri: https://github.com/zdmooc/enterprise-data-lakehouse-kubernetes-openshift.git
      ref: main
    contextDir: data-platform/lakehouse/image
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
      buildArgs:
        - name: ICEBERG_VERSION
          value: "1.11.0"
  output:
    to:
      kind: ImageStreamTag
      name: edl-spark-lakehouse:4.1.3-iceberg1.11
  triggers:
    - type: ConfigChange
