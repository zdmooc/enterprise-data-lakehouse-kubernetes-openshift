apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jupyter-workspace
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: edl-jupyter
spec:
  selector: {app: edl-jupyter}
  ports:
    - {name: http, port: 8888, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edl-jupyter
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: edl-jupyter}
  template:
    metadata:
      labels: {app: edl-jupyter}
    spec:
      serviceAccountName: data-workload
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: jupyter
          image: edl-jupyter:kind-2026-07-28
          imagePullPolicy: IfNotPresent
          args: [start-notebook.py, '--ServerApp.ip=0.0.0.0', '--ServerApp.port=8888', '--ServerApp.open_browser=False']
          env:
            - name: JUPYTER_TOKEN
              valueFrom:
                secretKeyRef: {name: jupyter-auth, key: token}
            - {name: TRINO_HOST, value: edl-trino.edl-data.svc.cluster.local}
            - {name: TRINO_PORT, value: '8080'}
          ports:
            - {name: http, containerPort: 8888}
          startupProbe:
            httpGet: {path: /login, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /login, port: http}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: '1', memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: workspace, mountPath: /home/jovyan/work}
      volumes:
        - name: workspace
          persistentVolumeClaim: {claimName: jupyter-workspace}
